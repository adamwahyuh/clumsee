<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#312e81"/>
    </radialGradient>
    <clipPath id="eye">
      <path d="M296 512 Q512 296 728 512 Q512 728 296 512 Z"/>
    </clipPath>
  </defs>
  <!-- macOS-style squircle with margin so it lines up with other Dock icons -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- selection corners: a box whose sides never meet -->
  <g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 400 V260 H400"/>
    <path d="M624 260 H764 V400"/>
    <path d="M764 624 V764 H624"/>
    <path d="M400 764 H260 V624"/>
  </g>
  <!-- eye -->
  <path d="M296 512 Q512 296 728 512 Q512 728 296 512 Z" fill="#fff"/>
  <g clip-path="url(#eye)">
    <circle cx="512" cy="512" r="88" fill="url(#iris)"/>
    <circle cx="512" cy="512" r="40" fill="#0b1020"/>
    <circle cx="538" cy="484" r="17" fill="#fff"/>
  </g>
</svg>
